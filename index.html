<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Escola de Programação</title>

    <!-- Bootstrap 5 (CSS) pelo CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Nosso CSS (vem depois do Bootstrap para poder sobrescrever) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo text-center">
        <h1>Escola de Programação</h1>
        <p class="mb-0">Preencha o formulário e comece a programar com a gente.</p>
    </header>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                
                <form action="#" method="post">

                   
                    <fieldset class="grupo">
                        <legend>Dados pessoais</legend>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nome" class="form-label">Nome:</label>
                                <input type="text" class="form-control" id="nome" name="nome"
                                    placeholder="Nome" maxlength="70" required>
                            </div>

                            <div class="col-md-6">
                                <label for="sobrenome" class="form-label">Sobrenome:</label>
                                <input type="text" class="form-control" id="sobrenome" name="sobrenome"
                                    placeholder="Sobrenome" maxlength="70" required>
                            </div>

                            <div class="col-12">
                                <label for="email" class="form-label">E-mail:</label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="E-mail" required>
                            </div>

                            <div class="col-md-6">
                                <label for="senha" class="form-label">Senha:</label>
                                <input type="password" class="form-control" id="senha" name="senha"
                                    placeholder="Mínimo de 4 caracteres" minlength="4" required >
                            </div>

                            <div class="col-md-6">
                                <label for="telefone" class="form-label">Telefone:</label>
                                <input type="tel" class="form-control" id="telefone" name="telefone"
                                    placeholder="11111111111" pattern="[0-9]{10,11}"
                                    title="Digite apenas números, com DDD (10 ou 11 dígitos)" required>
                            </div>

                            <div class="col-md-6">
                                <label for="idade" class="form-label">Idade:</label>
                                <input type="number" class="form-control" id="idade" name="idade"
                                    placeholder="Ex.: 18" min="14" max="100" required>
                            </div>

                            <div class="col-md-6">
                                <label for="nascimento" class="form-label">Data de nascimento:</label>
                                <input type="date" class="form-control" id="nascimento" name="nascimento"
                                    max="2011-12-31" required>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="grupo">
                        <legend>Informações do curso</legend>

                        <div class="mb-3">
                            <label for="curso" class="form-label">Curso:</label>
                           
                            <select class="form-select" id="curso" name="curso" required>
                                <option value="">Selecione o curso</option>
                                <option value="html-css">HTML e CSS</option>
                                <option value="javascript">JavaScript</option>
                                <option value="python">Python</option>
                                <option value="java">Java</option>
                                <option value="banco-de-dados">Banco de Dados</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <p class="form-label mb-1">Modalidade:</p>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="presencial"
                                    name="modalidade" value="presencial" required>
                                <label class="form-check-label" for="presencial">Presencial</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="online"
                                    name="modalidade" value="online" required>
                                <label class="form-check-label" for="online">Online</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="semi-presencial"
                                    name="modalidade" value="semi-presencial" required>
                                <label class="form-check-label" for="semi-presencial">Semi-Presencial</label>
                            </div>
                        </div>

                        
                        <div class="mb-3">
                            <p class="form-label mb-1">Horário:</p>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="manha"
                                    name="turno" value="manha" required>
                                <label class="form-check-label" for="manha">Manhã</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="tarde"
                                    name="turno" value="tarde" required>
                                <label class="form-check-label" for="tarde">Tarde</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="noite"
                                    name="turno" value="noite" required>
                                <label class="form-check-label" for="noite">Noite</label>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="grupo">
                        <legend>Conhecimentos</legend>

                        <div class="mb-3">
                            <label for="nivel" class="form-label">Nível de conhecimento:</label>
                            <select class="form-select" id="nivel" name="nivel" required>
                                
                                <option value="">Selecione seu nível</option>
                                <option value="iniciante">Iniciante</option>
                                <option value="intermediario">Intermediário</option>
                                <option value="avancado">Avançado</option>
                            </select>
                        </div>

                    
                        <div>
                            <p class="form-label mb-1">Quais desses você já conhece?</p>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tec-html"
                                    name="tecnologias" value="html">
                                <label class="form-check-label" for="tec-html">HTML</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tec-css"
                                    name="tecnologias" value="css">
                                <label class="form-check-label" for="tec-css">CSS</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tec-js"
                                    name="tecnologias" value="javascript">
                                <label class="form-check-label" for="tec-js">JavaScript</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tec-python"
                                    name="tecnologias" value="python">
                                <label class="form-check-label" for="tec-python">Python</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tec-java"
                                    name="tecnologias" value="java">
                                <label class="form-check-label" for="tec-java">Java</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tec-csharp"
                                    name="tecnologias" value="csharp">
                                <label class="form-check-label" for="tec-csharp">C#</label>
                            </div>
                        </div>
                    </fieldset>

                    
                    <fieldset class="grupo">
                        <legend>Localização</legend>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="estado" class="form-label">Estado:</label>
                                <select class="form-select" id="estado" name="estado" required>
                                    <option value="">Selecione</option>
                                    <option value="SP">São Paulo</option>
                                    <option value="RJ">Rio de Janeiro</option>
                                    <option value="MG">Minas Gerais</option>
                                    <option value="PR">Paraná</option>
                                    <option value="RS">Rio Grande do Sul</option>
                                    <option value="BA">Bahia</option>
                                </select>
                            </div>

                            <div class="col-md-8">
                                <label for="cidade" class="form-label">Cidade:</label>
                                <input type="text" class="form-control" id="cidade" name="cidade"
                                    placeholder="Digite sua cidade" minlength="3" maxlength="60" required>
                            </div>
                        </div>
                    </fieldset>

                
                    <fieldset class="grupo">
                        <legend>Curiosidades </legend>

                        <div class="mb-3">
                            <label for="motivo" class="form-label">
                                Por que você deseja fazer este curso?
                            </label>
                            <textarea class="form-control" id="motivo" name="motivo" rows="4"
                                placeholder="Conte um pouco sobre seus objetivos (mínimo de 20 caracteres)"
                                minlength="20" maxlength="500" required></textarea>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termos"
                                name="termos" value="aceito" required>
                            <label class="form-check-label" for="termos">
                                Aceito os termos de inscrição
                            </label>
                        </div>
                    </fieldset>

                         <div class="d-flex gap-2 justify-content-end">
                            <button type="reset" class="btn btn-outline-secondary">Limpar</button>
                        <a href="sucesso.html" class="btn btn-escola">Cadastrar</a>
                    </div>  

                </form>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 rodape">
        <small>Serviço Nacional de Aprendizagem - Projeto de formulário em HTML</small>
    </footer>

</body>
</html>
